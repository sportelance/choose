name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Inject AWS credentials
        run: |
          sed -i "s/__AWS_ACCESS_KEY_ID__/${{ secrets.AWS_ACCESS_KEY_ID }}/g" js/config.js
          sed -i "s/__AWS_SECRET_ACCESS_KEY__/${{ secrets.AWS_SECRET_ACCESS_KEY }}/g" js/config.js

      - name: Compile SCSS
        run: npm run build:css

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
          exclude: |
            workflows/**
            test/**
            node_modules/**
            scss/**
            package.json
            package-lock.json
            .gitignore
            README.md
            LICENSE
            *.md

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
