<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink Vote - Enter Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>🍹 Drink Vote</h1>
      <p>Rate your favorite drinks and see what everyone else thinks!</p>
    </div>
    
    <div class="page-content">
      <div class="container" style="max-width: 500px;">
        <form id="entry-form">
          <div style="margin-bottom: 2rem;">
            <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Your Name</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="input" 
              placeholder="Enter your name..." 
              required 
              autocomplete="off"
            >
          </div>
          
          <button type="submit" class="btn btn--primary" style="width: 100%;">Enter</button>
        </form>
      </div>
    </div>
    
    <div class="page-footer">
      <p>Drink Vote App</p>
    </div>
  </div>
  
  <script type="module" src="js/entry.js"></script>
</body>
</html>
