<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink Vote - Drink Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>🍹 Drink Details</h1>
      <a id="back-link" class="text-muted">← Back to all drinks</a>
    </div>
    
    <div class="page-content">
      <div class="container" style="max-width: 800px;">
        <img id="drink-photo" style="width: 100%; height: 400px; object-fit: cover; border-radius: 16px; margin-bottom: 2rem;" alt="">
        
        <h2 id="drink-name" style="font-size: 2.5rem; margin-bottom: 1rem;"></h2>
        <p id="drink-description" class="text-muted" style="font-size: 1.1rem; margin-bottom: 1.5rem;"></p>
        <p id="drink-ingredients" style="margin-bottom: 2rem;"></p>
        
        <div style="background-color: var(--color-surface, #16213e); padding: 2rem; border-radius: 16px;">
          <h3 style="margin-bottom: 1rem;">Rate this drink</h3>
          
          <div id="rating-container" style="margin-bottom: 1.5rem;"></div>
          
          <div style="margin-bottom: 1.5rem;">
            <label for="comment" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Comment (optional)</label>
            <textarea id="comment" class="textarea" placeholder="Add a comment..."></textarea>
          </div>
          
          <button id="submit-vote" class="btn btn--primary" style="width: 100%;">Submit Vote</button>
        </div>
      </div>
    </div>
    
    <div class="page-footer">
      <p>Drink Vote App</p>
    </div>
  </div>
  
  <script type="module" src="js/drink.js"></script>
</body>
</html>
