<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drink Vote - Enter Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/main-baBThs0v.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/main-C42kJmcz.js">
  <link rel="stylesheet" crossorigin href="./assets/main-vuhqtkbi.css">
</head>
<body>
  <div class="page">
    <div class="page-header">
      <h1>🍹 Drink Vote</h1>
      <p>Rate your favorite drinks and see what everyone else thinks!</p>
    </div>
    
    <div class="page-content">
      <div class="container" style="max-width: 500px;">
        <form id="entry-form">
          <div style="margin-bottom: 2rem;">
            <label for="name" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Your Name</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              class="input" 
              placeholder="Enter your name..." 
              required 
              autocomplete="off"
            >
          </div>
          
          <button type="submit" class="btn btn--primary" style="width: 100%;">Enter</button>
        </form>
      </div>
    </div>
    
    <div class="page-footer">
      <p>Drink Vote App</p>
    </div>
  </div>
  
  <!-- Confirmation Modal -->
  <div id="confirmation-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2>Welcome Back!</h2>
      <p>We've seen the name <strong id="duplicate-name"></strong> before. Are you the same person?</p>
      <div class="modal-buttons">
        <button id="confirm-yes" class="btn btn--primary">Yes, that's me</button>
        <button id="confirm-no" class="btn btn--secondary">No, I'm someone else</button>
      </div>
    </div>
  </div>
  
</body>
</html>
